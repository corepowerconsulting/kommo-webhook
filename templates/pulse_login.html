<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PULSE — Acceso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Inter', sans-serif; }
    .card { background:#fff; border-radius:16px; padding:32px; border:1px solid #e2e8f0; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <div class="flex items-center justify-center gap-2.5 mb-6">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </div>
      <span class="text-lg font-black text-slate-900 tracking-tight">PULSE</span>
    </div>

    <div class="card">
      <div class="text-sm font-semibold text-slate-700 mb-1">Acceso restringido</div>
      <div class="text-xs text-slate-400 mb-5">{{ subdomain }}</div>

      {% if error %}
      <div class="bg-red-50 text-red-600 text-xs font-medium rounded-lg px-3 py-2 mb-4">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('pulse', subdomain=subdomain) }}">
        <label class="text-xs font-medium text-slate-500">Contraseña</label>
        <input type="password" name="password" autofocus required
               class="mt-1.5 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-700 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white transition"/>
        <button type="submit"
                class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-semibold transition shadow-sm">
          Entrar
        </button>
      </form>
    </div>
  </div>

</body>
</html>
